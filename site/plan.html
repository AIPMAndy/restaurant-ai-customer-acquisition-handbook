rong>D09</strong>｜<strong>录制3段老板/员工口播</strong> — 交付原声素材和授权确认</span></label><label class="checkrow"><input type="checkbox" data-day="D10"><span><strong>D10</strong>｜<strong>制作第一条问题式视频</strong> — 交付可核实的字幕与店铺信息</span></label><label class="checkrow"><input type="checkbox" data-day="D11"><span><strong>D11</strong>｜<strong>制作第二条场景视频</strong> — 交付实际菜品和价格核验记录</span></label><label class="checkrow"><input type="checkbox" data-day="D12"><span><strong>D12</strong>｜<strong>制作第三条到店路线视频</strong> — 交付路线与营业时间核验</span></label><label class="checkrow"><input type="checkbox" data-day="D13"><span><strong>D13</strong>｜<strong>优化套餐条款</strong> — 交付收银/后厨审核完成的说明</span></label><label class="checkrow"><input type="checkbox" data-day="D14"><span><strong>D14</strong>｜<strong>验证购买到核销路径</strong> — 交付一次合规的链路验收记录</span></label><label class="checkrow"><input type="checkbox" data-day="D15"><span><strong>D15</strong>｜<strong>回复真实顾客疑问</strong> — 交付FAQ与真实反馈处理记录</span></label><label class="checkrow"><input type="checkbox" data-day="D16"><span><strong>D16</strong>｜<strong>设计A/B/C开头实验</strong> — 交付单变量假设和记录表</span></label><label class="checkrow"><input type="checkbox" data-day="D17"><span><strong>D17</strong>｜<strong>更新门店照片和菜单</strong> — 交付已公开的真实新资料</span></label><label class="checkrow"><input type="checkbox" data-day="D18"><span><strong>D18</strong>｜<strong>检查等位与接待产能</strong> — 交付高峰上限与超限措施</span></label><label class="checkrow"><input type="checkbox" data-day="D19"><span><strong>D19</strong>｜<strong>制作3篇场景型图文</strong> — 交付发布前事实审核表</span></label><label class="checkrow"><input type="checkbox" data-day="D20"><span><strong>D20</strong>｜<strong>整理真实评价主题</strong> — 交付前三类负反馈及改进人</span></label><label class="checkrow"><input type="checkbox" data-day="D21"><span><strong>D21</strong>｜<strong>对账一次渠道结算</strong> — 交付核销/退款/平台费一致性记录</span></label><label class="checkrow"><input type="checkbox" data-day="D22"><span><strong>D22</strong>｜<strong>对比两轮内容效果</strong> — 交付同口径观察、干扰因素清单</span></label><label class="checkrow"><input type

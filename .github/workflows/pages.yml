name: Publish Restaurant AI Handbook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate reviewed PDF and render QA previews
        run: |
          python3 -m pip install --disable-pip-version-check "pymupdf>=1.24,<2"
          python3 scripts/check_pdf_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-pdf-qa-previews
          path: pdf-qa/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify source evidence and deployed Pages resource hashes
        timeout-minutes: 8
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/verify_live.py
      - name: Archive independent live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-live-qa
          path: live-qa.json
          if-no-files-found: warn
